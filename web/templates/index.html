<!DOCTYPE html>
<html>
<head>
    <title>OurPlatform</title>
</head>

<body>

    <h1>Welcome to OurPlatform</h1>

    <p>Platform is running.</p>

    <h2>Search</h2>

    <form action="/search" method="POST">
        <input
            type="text"
            name="query"
            placeholder="Search..."
        >
        <button type="submit">Search</button>
    </form>

    <h2>Memory</h2>

    <form action="/remember" method="POST">
        <input
            type="text"
            name="text"
            placeholder="What should I remember?"
        >
        <button type="submit">Save</button>
    </form>

    <h2>Research</h2>

    <form action="/research" method="POST">
        <input
            type="text"
            name="question"
            placeholder="What should I research?"
        >
        <button type="submit">Research</button>
    </form>

</body>
</html>
