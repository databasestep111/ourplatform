<!DOCTYPE html>
<html>
<head>
    <title>OurPlatform</title>
</head>

<body>

    <h1>Welcome to OurPlatform</h1>

    <p>Our platform is running.</p>

    <form action="/ask" method="POST">
        <input
            type="text"
            name="message"
            placeholder="Ask OurPlatform..."
        >

        <button type="submit">
            Send
        </button>
    </form>

    {% if response %}
        <h2>Response</h2>
        <p>{{ response }}</p>
    {% endif %}

</body>
</html>
