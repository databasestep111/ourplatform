<!-- =========================================================
     SEARCH API CONNECTION
     
     The search page uses the browser-side SearchAPI client
     to communicate with:

         /api/search
             ↓
         api/search_api.py
             ↓
         search/search.py

     This keeps the template presentation-focused while
     allowing the frontend to communicate with the backend.
========================================================= -->

<script
    src="{{ url_for('static', filename='js/search_api.js') }}"
    defer
></script>


<script>
document.addEventListener("DOMContentLoaded", function () {

    /*
     * =========================================================
     * SEARCH FRONTEND API BRIDGE
     * =========================================================
     *
     * We deliberately locate the existing search form instead
     * of replacing your current HTML structure.
     */

    const searchForms = document.querySelectorAll(
        'form[action="/search"]'
    );

    if (!searchForms.length) {
        return;
    }


    /*
     * The first /search form is the primary search form.
     */

    const mainSearchForm = searchForms[0];

    const queryInput = mainSearchForm.querySelector(
        'input[name="query"]'
    );


    if (!queryInput) {
        return;
    }


    /*
     * =========================================================
     * LIVE API RESULT CONTAINER
     * =========================================================
     */

    let apiResultsContainer =
        document.getElementById(
            "search-api-results"
        );


    if (!apiResultsContainer) {

        apiResultsContainer =
            document.createElement("section");

        apiResultsContainer.id =
            "search-api-results";

        apiResultsContainer.className =
            "card";

        mainSearchForm.insertAdjacentElement(
            "afterend",
            apiResultsContainer
        );
    }


    /*
     * =========================================================
     * STATUS
     * =========================================================
     */

    function showLoading(query) {

        apiResultsContainer.innerHTML = `
            <h2>🔎 Searching...</h2>

            <p>
                Searching for:
                <strong>${escapeHTML(query)}</strong>
            </p>

            <p>
                Please wait while the search engine
                retrieves and ranks results.
            </p>
        `;
    }


    function showError(error) {

        const message =
            error && error.message
                ? error.message
                : "Search request failed.";

        apiResultsContainer.innerHTML = `
            <h2>⚠️ Search Error</h2>

            <p>
                ${escapeHTML(message)}
            </p>

            <p>
                Check your connection and try again.
            </p>
        `;
    }


    /*
     * =========================================================
     * HTML ESCAPING
     * =========================================================
     *
     * API data should never be inserted into HTML without
     * escaping it first.
     */

    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    /*
     * =========================================================
     * TAG RENDERING
     * =========================================================
     */

    function renderTags(tags) {

        if (!Array.isArray(tags)) {
            return "";
        }

        if (!tags.length) {
            return "";
        }

        return `
            <div>
                <strong>Tags:</strong>

                ${tags.map(tag => `
                    <span>
                        #${escapeHTML(tag)}
                    </span>
                `).join(" ")}
            </div>
        `;
    }


    /*
     * =========================================================
     * RESULT RENDERING
     * =========================================================
     */

    function renderResult(result, index) {

        const title =
            result.title ||
            "Untitled";

        const content =
            result.snippet ||
            result.content ||
            "No preview available.";

        const category =
            result.category ||
            "";

        const score =
            result.score !== undefined
                ? result.score
                : null;

        const type =
            result.type ||
            "";

        const url =
            result.url ||
            "";


        const titleHTML = url
            ? `
                <a
                    href="${escapeHTML(url)}"
                >
                    ${escapeHTML(title)}
                </a>
            `
            : escapeHTML(title);


        return `
            <article
                class="card"
                data-search-result-index="${index}"
                data-search-result-id="${escapeHTML(
                    result.id ?? ""
                )}"
            >

                <header>

                    <h3>
                        ${titleHTML}
                    </h3>

                    ${
                        type
                            ? `
                                <p>
                                    <small>
                                        ${escapeHTML(type)}
                                    </small>
                                </p>
                            `
                            : ""
                    }

                </header>


                <div>

                    <p>
                        ${escapeHTML(content)}
                    </p>

                </div>


                ${
                    category
                        ? `
                            <p>
                                <strong>
                                    Category:
                                </strong>

                                ${escapeHTML(category)}
                            </p>
                        `
                        : ""
                }


                ${
                    score !== null
                        ? `
                            <p>
                                <strong>
                                    Relevance:
                                </strong>

                                ${escapeHTML(score)}
                            </p>
                        `
                        : ""
                }


                ${renderTags(result.tags)}


                ${
                    result.created_at
                        ? `
                            <p>
                                <small>
                                    Created:
                                    ${escapeHTML(
                                        result.created_at
                                    )}
                                </small>
                            </p>
                        `
                        : ""
                }

            </article>
        `;
    }


    /*
     * =========================================================
     * RESULTS PAGE
     * =========================================================
     */

    function renderResults(response) {

        const data =
            response &&
            response.data
                ? response.data
                : {};

        const results =
            Array.isArray(data.results)
                ? data.results
                : [];

        const query =
            data.query ||
            response.query ||
            queryInput.value;


        if (!results.length) {

            apiResultsContainer.innerHTML = `
                <h2>📚 Search Results</h2>

                <p>
                    Searching for:
                    <strong>
                        ${escapeHTML(query)}
                    </strong>
                </p>

                <div class="card">

                    <h3>
                        No results found
                    </h3>

                    <p>
                        Nothing matched this query.
                    </p>

                    <p>
                        Try a broader keyword or
                        remove some filters.
                    </p>

                </div>
            `;

            return;
        }


        apiResultsContainer.innerHTML = `

            <h2>
                📚 Live API Results
            </h2>

            <p>
                Searching for:
                <strong>
                    ${escapeHTML(query)}
                </strong>
            </p>

            <p>
                Found
                <strong>
                    ${results.length}
                </strong>
                result(s).
            </p>

            ${results
                .map(renderResult)
                .join("")}

        `;
    }


    /*
     * =========================================================
     * FORM SUBMISSION
     * =========================================================
     */

    mainSearchForm.addEventListener(
        "submit",
        async function (event) {

            /*
             * Stop the old full-page POST.
             *
             * The browser will now use the API instead.
             */

            event.preventDefault();


            const query =
                queryInput.value.trim();


            if (!query) {

                queryInput.focus();

                return;
            }


            /*
             * Read the advanced controls already present
             * elsewhere on the page.
             */

            const categoryElement =
                document.querySelector(
                    'select[name="category"]'
                );


            const tagElement =
                document.querySelector(
                    'input[name="tag"]'
                );


            const limitElement =
                document.querySelector(
                    'select[name="limit"]'
                );


            const category =
                categoryElement
                    ? categoryElement.value
                    : null;


            const tag =
                tagElement
                    ? tagElement.value
                    : "";


            const limit =
                limitElement
                    ? limitElement.value
                    : 10;


            /*
             * Make sure SearchAPI has loaded.
             */

            if (
                typeof window.SearchAPI ===
                "undefined"
            ) {

                showError({
                    message:
                        "Search API client could not be loaded."
                });

                return;
            }


            showLoading(query);


            try {

                const response =
                    await window.SearchAPI.search({
                        query: query,

                        category:
                            category || null,

                        tags:
                            tag
                                ? [tag]
                                : [],

                        limit: limit
                    });


                renderResults(
                    response
                );


            } catch (error) {

                console.error(
                    "OurPlatform Search API error:",
                    error
                );

                showError(
                    error
                );
            }
        }
    );


    /*
     * =========================================================
     * ENTER-KEY SUPPORT
     * =========================================================
     */

    queryInput.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key ===
                "Enter"
            ) {

                /*
                 * Let the normal submit handler deal with it.
                 */

                return;
            }
        }
    );


    /*
     * =========================================================
     * INITIAL API STATE
     * =========================================================
     */

    if (
        typeof window.SearchAPI !==
        "undefined"
    ) {

        window.SearchAPI.initialize({
            baseURL: "/api/search",
            defaultLimit: 10,
            timeout: 30000
        });

    }

});
</script>

{% endblock %}
